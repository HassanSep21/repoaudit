version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./repoaudit.db
      - PILLAR_TIMEOUT=60
      - SECURITY_PILLAR_TIMEOUT=180
    volumes:
      - ./backend/app:/app/app